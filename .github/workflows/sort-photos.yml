name: Auto-sort photos into folders

on:
  push:
    branches: [main]
    paths:
      - "*.jpg"
      - "*.jpeg"
      - "*.JPG"
      - "*.JPEG"
      - "*.png"
      - "*.PNG"

jobs:
  sort:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run sort script
        run: python3 sort_photos.py

      - name: Commit sorted photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Auto-sort: organize photos into folders"
          git push
